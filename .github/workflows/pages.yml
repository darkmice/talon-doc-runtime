name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# 只允许一个并发部署，新部署会取消进行中的。
concurrency:
  group: pages
  cancel-in-progress: true

# Pages 部署所需权限。
permissions:
  contents: read
  pages: write
  id-token: write

# Opt JavaScript-based actions into the Node 24 runtime ahead of
# GitHub's 2026-06-02 forced cut-over.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    name: Deploy examples to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The runtime IIFE is loaded from unpkg by most pages, but the online
      # playground needs the browser markdown bundle (mdToTdr with remark
      # bundled in). Build it and copy it next to examples/ so the playground
      # loads it same-origin instead of waiting on an npm publish.
      - name: Install & build browser markdown bundle
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          cp dist/markdown.browser.js examples/markdown.browser.js

      - name: Upload examples as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
